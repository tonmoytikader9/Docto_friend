<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Doctor Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --primary:#0040ff;
      --bg:#f6f8ff;
      --card-bg:#ffffff;
      --muted:#6b7280;
      --accent:#0b63ff;
      --card-shadow:0 12px 32px rgba(0,64,255,0.10);
      --input-shadow:0 8px 20px rgba(0,64,255,0.06);
      --radius:12px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg,var(--bg),#ffffff 60%);
      color:#0b1226;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }





    .password-container{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
}

.password-container input{
    flex: 1;
    padding: 12px 14px;
    border: 1px solid rgba(0,0,0,0.09);
    border-radius: 8px;
    box-shadow: var(--input-shadow);
    font-size: 15px;
    background: #fff;
}

.toggle-password{
    width: 44px;
    height: 44px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid rgba(0,0,0,0.09);
    border-radius: 8px;

    background: #fff;
    box-shadow: var(--input-shadow);

    cursor: pointer;
    color: #6b7280;

    transition: all 0.2s ease;
}

.toggle-password:hover{
    color: var(--primary);
    border-color: var(--primary);
}

.toggle-password svg{
    width: 20px;
    height: 20px;
}



    .wrap{
      width:100%;
      max-width:920px;
      display:grid;
      grid-template-columns: 1fr 420px;
      gap:28px;
      align-items:center;
    }

    /* Left promo */
    .promo{
      background:linear-gradient(180deg, rgba(0,64,255,0.03), transparent);
      padding:32px;
      border-radius:var(--radius);
      box-shadow:var(--card-shadow);
      border:1px solid rgba(0,64,255,0.06);
    }
    .brand{
      display:flex; align-items:center; gap:14px; margin-bottom:18px;
    }
    .logo{
          width:100px;                 /* slightly larger */
      height:100px;
      border-radius:0;            /* no box around it */
      background-color: transparent;
      background-repeat: no-repeat;
      background-size: contain;   /* show entire sticker without cropping */
      background-position: center;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:6px;                /* optional breathing space */
      box-shadow: none;
      border: none;
      font-size:20px;             /* can be removed if not showing text */
      line-height:0;
    }

    /* if you want it perfectly sharp on high-density screens */
    .logo img {
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      image-rendering: -webkit-optimize-contrast; /* improves clarity for some PNGs */
    }
    /* Right login card */
    .card{
      background:var(--card-bg);
      border-radius:var(--radius);
      padding:28px;
      box-shadow:var(--card-shadow);
      border:1px solid rgba(0,64,255,0.05);
    }
    .card h2{ margin:0 0 6px 0; color:var(--primary); font-size:20px; }
    .card p.sub{ margin:0 0 18px 0; color:var(--muted); font-size:13px; }

    label{ display:block; font-weight:600; color:#062a8a; margin-top:10px; font-size:13px; }
    input[type="email"],
    input[type="text"],
    input[type="password"]{
      width:100%; padding:12px 14px; margin-top:8px; border-radius:8px;
      border:1px solid rgba(0,0,0,0.09); box-shadow:var(--input-shadow);
      font-size:15px; background:#fff;
    }
    .row{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
    .remember{ display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; }
    .link{ color:var(--primary); text-decoration:none; font-weight:600; font-size:13px; }

    .btn{
      width:100%; margin-top:16px; padding:12px; border-radius:10px; border:none;
      background:linear-gradient(180deg,var(--primary),#0033cc); color:#fff; font-weight:700;
      box-shadow:0 10px 28px rgba(0,64,255,0.12); cursor:pointer; font-size:15px;
    }

    .alt {
      margin-top:12px; text-align:center; color:var(--muted); font-size:13px;
    }
    .alt a{ color:var(--primary); text-decoration:none; font-weight:600; }

    /* small screens */
    @media (max-width:900px){
      .wrap{ grid-template-columns: 1fr; }
      .promo{ order:2 }
      .card{ order:1 }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="promo">
      <div class="brand">
        <div class="logo"><img src="{{ url_for('static', filename='image/doctopal_logo_1.jpeg') }}" alt="Logo" style="width:56px;height:56px;border-radius:10px;object-fit:cover;"></div>
        <div>
          <div style="font-weight:700; color:var(--primary);">Doctor Dashboard</div>
          <div style="color:var(--muted); font-size:13px;">Secure access for clinicians</div>
        </div>
      </div>
      <h1>Seamless access. Smart care.</h1>
      <p>Log in to manage clinics, appointments and patient records. Fast, secure and built for healthcare professionals.</p>
    </div>

    <div class="card" role="main" aria-labelledby="loginTitle">
      <h2 id="loginTitle">Welcome back, Doctor</h2>
      <p class="sub">Sign in to continue to your dashboard</p>

      <form id="loginForm" autocomplete="on">
        <label for="identifier">Email or License</label>
        <input id="identifier" name="identifier" type="text" placeholder="you@hospital.com or LICENSE123" required>

        <label for="password">Password</label>

<div class="password-container">
    <input
        id="password"
        name="password"
        type="password"
        placeholder="Enter your password"
        required
    >

    <button
        type="button"
        class="toggle-password"
        id="togglePassword"
        aria-label="Show password">

        <!-- Your eye SVG here -->
        <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg"
             width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>

    </button>
</div>

        <div class="row">
          <label class="remember"><input type="checkbox" id="remember"> Remember me</label>
          <a class="link" href="{{ url_for('main.doctor_forgot_password_page') }}">Forgot password?</a>
        </div>

        <button id="loginBtn" class="btn" type="submit">Sign in</button>
        <div class="alt">New here? <a href="{{ url_for('main.doctor_registration_form') }}">Create an account</a></div>
      
      </form>
    </div>
  </div>

  <script>
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const eyeOpen = document.getElementById("eyeOpen");
const eyeClosed = document.getElementById("eyeClosed");

togglePassword.addEventListener("click", () => {

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeOpen.style.display = "none";
        eyeClosed.style.display = "block";
        togglePassword.setAttribute("aria-label", "Hide password");
    } else {
        passwordInput.type = "password";
        eyeOpen.style.display = "block";
        eyeClosed.style.display = "none";
        togglePassword.setAttribute("aria-label", "Show password");
    }

});

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const identifier = document.getElementById('identifier').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;
    if (!identifier || !password) { alert('Please enter identifier and password'); return; }

    try {
      const res = await fetch('{{ url_for("main.api_doctor_login") }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier, password, remember })
      });
      const json = await res.json();
      if (res.ok && json.success) {
        // redirect to dashboard (adjust route as needed)
        const doctorId = json.user_id || json.doctor_id || (json.user && json.user.doctor_id);
        if (doctorId) {
          window.location.href = json.redirect || `/doc_dashboard/${encodeURIComponent(doctorId)}`;
          console.log("Doctor Id from doc login");
          console.log(doctorId);
        } else {
          console.error("doctor_id missing in response !!", json);
          alert("Login succeeded but redirect failed. Contact admin.");
        }
        
      } else {
        alert(json.error || 'Login failed');
      }
    } catch (err) {
      console.error(err);
      alert('Network error');
    }
  });
</script>
</body>
</html>
